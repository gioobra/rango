{{define "conteudo"}}
<main class="min-h-dvh flex items-center justify-center px-5">
  <form method="post" action="/login" class="w-full max-w-sm bg-card rounded-3xl p-8 shadow-sm space-y-5 text-center">
    <img src="/static/nutri.png" alt="" class="w-20 h-20 mx-auto">
    <div>
      <h1 class="text-2xl font-extrabold text-primary">Rango</h1>
      <p class="text-sm text-on-surface-variant">Seu diário alimentar</p>
    </div>
    {{if .Erro}}<p class="px-4 py-2 rounded-xl bg-error-container text-on-error-container text-sm" role="alert">{{.Erro}}</p>{{end}}
    <input type="password" name="senha" placeholder="Senha" autocomplete="current-password" required autofocus
      class="w-full h-12 px-4 rounded-2xl bg-surface-container-low focus:outline-none focus:ring-2 focus:ring-primary">
    <button class="w-full h-12 rounded-2xl bg-primary text-on-primary font-bold">Entrar</button>
  </form>
</main>
{{end}}
