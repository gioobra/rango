# Rango num container, com o Nutri por uma API compatível com a da OpenAI.
# Defina RANGO_SENHA (e a chave, se for o caso) num .env ao lado deste arquivo.
services:
  rango:
    build: .
    restart: unless-stopped
    # Só no localhost do host. Para o celular, use a Tailscale no host ou um sidecar dela.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - rango:/data
    environment:
      RANGO_SENHA: ${RANGO_SENHA:?defina RANGO_SENHA}
      # Ollama rodando no host (gratuito, local):
      RANGO_LLM_URL: http://host.docker.internal:11434/v1
      RANGO_LLM_MODEL: ${RANGO_LLM_MODEL:?defina RANGO_LLM_MODEL}
      # API externa (OpenRouter, Groq, Gemini, OpenAI...): troque a URL e passe a chave.
      # RANGO_LLM_URL: https://openrouter.ai/api/v1
      # RANGO_LLM_KEY: ${RANGO_LLM_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  rango:
